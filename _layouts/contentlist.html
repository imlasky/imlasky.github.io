---
layout: default
---

<div class="post-header">
  <h1 class="post-title">{{ page.title }}</h1>
</div>

<ul class="posts-list">
  {% for post in site.posts %}
    <li>
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <p class="post-meta">{{ post.date | date: "%B %-d, %Y" }}</p>

      {% if post.tags %}
        <div class="post-tags">
          {% for tag in post.tags %}
            <span class="post-tag"><a href="{{ site.baseurl }}/tags/{{ tag | downcase | replace: ' ', '-' }}.html">{{ tag }}</a></span>
          {% endfor %}
        </div>
      {% endif %}
    </li>
  {% endfor %}
</ul>
